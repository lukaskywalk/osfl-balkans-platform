<!DOCTYPE html>
<html lang="hr" data-i18n-title="tool_comparator_title">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Business Structure Comparator — OSFL Balkans</title>
  <link rel="stylesheet" href="/css/main.css">
  <script src="/js/tool-i18n.js?v=2"></script>
  <style>
    .question { margin-bottom: 20px; }
    .question p { font-weight: 600; margin-bottom: 8px; }
    .question label { display: block; padding: 8px 12px; border: 1px solid #ddd; border-radius: 4px; margin-bottom: 6px; cursor: pointer; }
    .question label:hover { border-color: #005fa3; background: #f0f7ff; }
    .question input[type=radio]:checked + span { font-weight: 600; }
    .comparison-table { width: 100%; border-collapse: collapse; margin-top: 24px; font-size: 0.875rem; }
    .comparison-table th { background: #005fa3; color: #fff; padding: 10px 12px; text-align: left; }
    .comparison-table td { padding: 8px 12px; border: 1px solid #ddd; vertical-align: top; }
    .comparison-table tr:nth-child(even) td { background: #fafafa; }
    .recommended { background: #e8f5e9 !important; }
    .badge { display: inline-block; padding: 2px 8px; border-radius: 20px; font-size: 0.75rem; font-weight: 600; }
    .badge-recommended { background: #1a7a4a; color: #fff; }
  </style>
</head>
<body>
<main id="main-content" style="max-width:760px;margin:40px auto;padding:0 20px">
  <a id="back-link" href="/" data-i18n="back_link" style="font-size:0.85rem;color:#555">← OSFL Balkans</a>
  <script>(function(){var l=new URLSearchParams(window.location.search).get('lang')||'hr';document.getElementById('back-link').href='/'+l+'/';})()</script>
  <h1 data-i18n="tool_comparator_title" style="margin-top:16px">Business Structure Comparator</h1>
  <p data-i18n="tool_comparator_desc" style="color:#555;margin-bottom:28px">Answer a few questions to compare legal business structures available in your country.</p>

  <div class="form-group">
    <label for="country" data-i18n="country">Country</label>
    <select id="country" onchange="loadCountry(this.value)">
      <option data-i18n="select_country" value="">— Select country —</option>
      <option data-i18n="country_hr" value="HR">Croatia</option>
      <option data-i18n="country_rs" value="RS">Serbia</option>
      <option data-i18n="country_ba" value="BA">Bosnia &amp; Herzegovina</option>
      <option data-i18n="country_me" value="ME">Montenegro</option>
      <option data-i18n="country_mk" value="MK">North Macedonia</option>
      <option data-i18n="country_al" value="AL">Albania</option>
    </select>
  </div>

  <div id="questions" style="display:none">
    <div class="question">
      <p data-i18n="q1_title">What best describes your business?</p>
      <label><input type="radio" name="type" value="solo"> <span data-i18n="q1_solo">I work alone (freelancer / sole trader)</span></label>
      <label><input type="radio" name="type" value="small"> <span data-i18n="q1_small">Small team (2–10 people)</span></label>
      <label><input type="radio" name="type" value="company"> <span data-i18n="q1_company">Formal company with investors or partners</span></label>
    </div>
    <div class="question">
      <p data-i18n="q2_title">Estimated annual revenue</p>
      <label><input type="radio" name="revenue" value="low"> <span data-i18n="q2_low">Under €20,000 / year</span></label>
      <label><input type="radio" name="revenue" value="mid"> <span data-i18n="q2_mid">€20,000 – €100,000 / year</span></label>
      <label><input type="radio" name="revenue" value="high"> <span data-i18n="q2_high">Over €100,000 / year</span></label>
    </div>
    <div class="question">
      <p data-i18n="q3_title">How important is limiting personal liability?</p>
      <label><input type="radio" name="liability" value="low"> <span data-i18n="q3_low">Not important — I accept personal risk</span></label>
      <label><input type="radio" name="liability" value="high"> <span data-i18n="q3_high">Important — I want to protect personal assets</span></label>
    </div>
    <button class="btn-primary" data-i18n="compare" onclick="compare()" style="margin-top:8px;width:100%">Compare structures</button>
  </div>

  <div id="result" style="display:none"></div>
</main>
<script src="comparator.js"></script>
<script>
document.addEventListener('DOMContentLoaded', function() {
  if (window.toolI18n) toolI18n.applyAll();
});
</script>
</body>
</html>
